<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#162c2b"><title>تسجيل الدخول | بنيان</title><link rel="stylesheet" href="./app.css?v=66"><script src="./cloud-config.js?v=3"></script><script src="./cloud-client.js?v=3"></script><script defer src="./auth.js?v=5"></script></head><body class="login-body"><main class="login-card"><div class="brandmark">ب</div><h1>بُنيان</h1><p class="login-subtitle">نظام إدارة المقاولات</p><form id="firstAdminForm" hidden><h2>تهيئة حساب المدير</h2><p>أدخل رمز التهيئة من سجل تشغيل Apps Script ثم أنشئ الحساب الأول.</p><label>رمز التهيئة<input name="setupKey" autocomplete="one-time-code"></label><label>الاسم الكامل<input name="name" required autocomplete="name"></label><label>اسم المستخدم<input name="username" required dir="ltr" autocomplete="username"></label><label>كلمة المرور<input name="password" type="password" minlength="10" required autocomplete="new-password"></label><label>تأكيد كلمة المرور<input name="confirm" type="password" minlength="10" required autocomplete="new-password"></label><button class="primary login-submit" type="submit">إنشاء حساب المدير</button></form><form id="signInForm" hidden><h2>تسجيل الدخول</h2><p>أدخل بيانات حسابك للمتابعة.</p><label>اسم المستخدم<input name="username" required dir="ltr" autocomplete="username"></label><label>كلمة المرور<input name="password" type="password" required autocomplete="current-password"></label><button class="primary login-submit" type="submit">دخول</button></form><div class="auth-message" id="authMessage" role="alert"></div><details class="api-setup"><summary>إعداد اتصال Google Sheets</summary><p>الصق رابط Web App المنشور من Google Apps Script.</p><form id="apiSetupForm"><label>رابط Apps Script<input name="url" type="url" dir="ltr" placeholder="https://script.google.com/macros/s/.../exec" required></label><button class="secondary" type="submit">حفظ رابط الخدمة</button></form></details><small class="login-foot">تُحفظ بيانات المؤسسة في Google Sheets عند تفعيل الربط.</small></main></body></html>
